# CI: the acceptance criteria's own test suite.
#
# oasis-pub-check grades other people's publications, so a defect in it
# mis-grades work silently. This suite is the regression net: a fixture per
# fixed defect, plus smoke coverage over the CLI contract that gate.py, the
# composite action and the runbook all depend on.
#
# There is no inherited-baseline argument here. A red run blocks.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # The checker is stdlib-only; poppler-utils matches the runtime the
      # pub-check workflow gives it, so the optional PDF cross-check takes the
      # same path in CI as it does on a maintainer's machine.
      - name: Install pdftotext (optional PDF cross-check)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # The checker is stdlib-only. beautifulsoup4 is not its dependency: it
      # belongs to the document pipeline under .github/src/, which
      # tests/test_pdf_command.py exercises to pin the wkhtmltopdf argument
      # vector. Without it that file skips, and a skipped test proves nothing.
      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest beautifulsoup4

      - name: Run pytest
        run: pytest tests/ -v

      # The registry/AST parity assertion inside --list-checks is the tool's
      # self-audit: it raises if the documented condition registry drifts from
      # the code. Run it as its own step so drift is legible in the log.
      - name: Check the condition registry is in sync with the code
        run: python3 pub-check/oasis_pub_check.py --list-checks

      # --list-checks proves the registry matches the code. Nothing proved the
      # GENERATED documentation matches the registry, and that is exactly where
      # it drifted: stage-uri-live landed on 31 August and CHECKS.md sat at the
      # previous count for twelve days, because the generator had been failing
      # that whole time on a missing class description and nothing ran it.
      # Regenerating and diffing makes an unregenerated catalog a red run.
      - name: Check the generated catalog matches the registry
        run: |
          python3 pub-check/render_checks_md.py
          git diff --exit-code -- pub-check/CHECKS.md

      # The diagrams carry the advertised counts too, and drifted the same way.
      # They are NOT checked by regenerating them: assets/build.py is a local
      # authoring helper, gitignored and not in the repository, so a step that
      # ran it could only ever fail here. tests/test_advertised_counts.py reads
      # the committed SVG sources instead and asserts the counts they carry
      # against the registry, which is the invariant that actually matters and
      # is testable everywhere. The PNGs are rendered from those sources by
      # rsvg-convert, whose output is not byte-stable across versions, so they
      # are regenerated and eyeballed at release time rather than diffed here.
