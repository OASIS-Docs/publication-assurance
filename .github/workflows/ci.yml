# CI: the acceptance criteria's own test suite.
#
# oasis-pub-check grades other people's publications, so a defect in it
# mis-grades work silently. This suite is the regression net: a fixture per
# fixed defect, plus smoke coverage over the CLI contract that gate.py, the
# composite action and the runbook all depend on.
#
# There is no inherited-baseline argument here. A red run blocks.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history: tests/test_gate_change_review.py replays this
      # repository's own pull requests as its fixtures.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # The checker is stdlib-only; poppler-utils matches the runtime the
      # pub-check workflow gives it, so the optional PDF cross-check takes the
      # same path in CI as it does on a maintainer's machine.
      - name: Install pdftotext (optional PDF cross-check)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # The checker is stdlib-only. beautifulsoup4 is not its dependency: it
      # belongs to the document pipeline under .github/src/, which
      # tests/test_pdf_command.py exercises to pin the wkhtmltopdf argument
      # vector. PyYAML reads the shipped criteria and authority map for
      # tests/test_authorities.py. Both are imported hard rather than skipped:
      # a skipped authority check proves nothing.
      # requests is imported by the pipeline package that
      # tests/test_step2_script.py runs end to end through the step 2 script.
      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest beautifulsoup4 PyYAML requests

      # google-chrome ships on ubuntu-latest, so the Validation Report PDF
      # test must run here: REQUIRE_CHROME=1 turns its skip into a failure.
      - name: Run pytest
        env:
          REQUIRE_CHROME: "1"
        run: pytest tests/ -v

      # The registry/AST parity assertion inside --list-checks is the tool's
      # self-audit: it raises if the documented condition registry drifts from
      # the code. Run it as its own step so drift is legible in the log.
      - name: Check the condition registry is in sync with the code
        run: python3 pub-check/oasis_pub_check.py --list-checks

      # --list-checks proves the registry matches the code. Nothing proved the
      # GENERATED documentation matches the registry, and that is exactly where
      # it drifted: stage-uri-live landed on 31 August and CHECKS.md sat at the
      # previous count for twelve days, because the generator had been failing
      # that whole time on a missing class description and nothing ran it.
      # Regenerating and diffing makes an unregenerated catalog a red run.
      - name: Check the generated catalog matches the registry
        run: |
          python3 pub-check/render_checks_md.py
          git diff --exit-code -- pub-check/CHECKS.md pub-check/README.md

      # The diagrams carry the advertised counts too, and drifted the same way.
      # They are NOT checked by regenerating them: assets/build.py is a local
      # authoring helper, gitignored and not in the repository, so a step that
      # ran it could only ever fail here. tests/test_advertised_counts.py reads
      # the committed SVG sources instead and asserts the counts they carry
      # against the registry, which is the invariant that actually matters and
      # is testable everywhere. The PNGs are rendered from those sources by
      # rsvg-convert, whose output is not byte-stable across versions, so they
      # are regenerated and eyeballed at release time rather than diffed here.

  # The composite action is what TCs run, and nothing else in CI runs it. This
  # job calls it on a corpus package exactly as a TC workflow does, then
  # asserts every report file it promises exists and that the Validation
  # Report lists every check class --list-checks prints. The gate's own
  # result on this package is not the question here, so the step may fail.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run the action on a corpus package
        id: gate
        uses: ./
        continue-on-error: true
        with:
          target: examples/csaf/v2.1/csd01
          summary-title: "CSAF v2.1 CSD01 (corpus)"

      - name: Check the action's report outputs
        env:
          EXIT_CODE: ${{ steps.gate.outputs.exit-code }}
          TXT: ${{ steps.gate.outputs.report-txt }}
          JSON: ${{ steps.gate.outputs.report-json }}
          VMD: ${{ steps.gate.outputs.report-validation-md }}
          VHTML: ${{ steps.gate.outputs.report-validation-html }}
          VPDF: ${{ steps.gate.outputs.report-validation-pdf }}
        run: |
          set -eu
          echo "gate exit code: $EXIT_CODE"
          case "$EXIT_CODE" in 0|1) ;; *) echo "unexpected gate exit $EXIT_CODE"; exit 1;; esac
          for f in "$TXT" "$JSON" "$VMD" "$VHTML" "$VPDF"; do
            test -n "$f" || { echo "an output path is empty"; exit 1; }
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          classes=$(python3 pub-check/oasis_pub_check.py --list-checks | grep -cE '^  [a-z0-9-]+ +[0-9]+$')
          rows=$(sed -n '/^## Check-by-Check Results/,/^## /p' "$VMD" | grep -cE '^\| [0-9]+ \|')
          echo "classes in --list-checks: $classes; class rows in the report: $rows"
          test "$classes" -gt 0 && test "$classes" = "$rows"
          head -c 5 "$VPDF" | grep -q '%PDF-'
          text=$(pdftotext "$VPDF" - | tr -d '[:space:]')
          missing=0
          for c in $(python3 pub-check/oasis_pub_check.py --list-checks | sed -nE 's/^  ([a-z0-9-]+) +[0-9]+$/\1/p'); do
            case "$text" in *"$c"*) ;; *) echo "class missing from the PDF: $c"; missing=1;; esac
          done
          test "$missing" = 0

      # The same job that runs the action runs the PDF test, and may not skip it.
      - name: Test the Validation Report PDF on this runner
        env:
          REQUIRE_CHROME: "1"
        run: |
          python3 -m pip install pytest PyYAML
          pytest tests/test_validation_report_pdf.py -v -rs

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pubcheck-report-csaf-v2.1-csd01
          path: pubcheck-report/

  # The PDF type scale, measured on the renderer that makes the PDFs. The
  # test job above has no wkhtmltopdf, so tests/test_pdf_type_scale.py's
  # render test skips there; here REQUIRE_WKHTMLTOPDF=1 makes a skip a
  # failure. The .deb is the one the step 2 workflow installs, and
  # test_the_render_job_installs_the_workflow_s_wkhtmltopdf keeps them equal.
  pdf-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install wkhtmltopdf and fonts (as the step 2 workflow does)
        run: |
          sudo apt-get update
          sudo apt-get install -y xfonts-75dpi fonts-liberation fonts-dejavu
          wget -q https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-2/wkhtmltox_0.12.6.1-2.jammy_amd64.deb
          sudo apt-get install -y ./wkhtmltox_0.12.6.1-2.jammy_amd64.deb
          wkhtmltopdf --version

      - name: Install test dependencies
        run: python3 -m pip install pytest beautifulsoup4 PyYAML requests pymupdf

      - name: Render a real package and measure its type sizes
        env:
          REQUIRE_WKHTMLTOPDF: "1"
        run: pytest tests/test_pdf_type_scale.py tests/test_pdf_command.py -v -s
