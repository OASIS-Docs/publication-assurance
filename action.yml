#
# oasis-pub-check as a drop-in GitHub Action.
#
# A TC adds ONE step to its own CI and the publication gate runs against its
# package. The action bundles the self-contained engine
# (pub-check/oasis_pub_check.py, stdlib only, no external data files), so the TC
# copies nothing into its repo and pins to a version tag to receive fixes.
#
# Requires a checkout step before it (the gate reads the package from the
# calling repo's checked-out working directory).
#
# Minimal usage in a TC repo (.github/workflows/pub-check.yml):
#
#   name: pub-check
#   on:
#     workflow_dispatch:
#       inputs:
#         target: { description: "stage dir or .zip", required: true }
#   jobs:
#     pub-check:
#       runs-on: ubuntu-latest
#       permissions:
#         contents: read
#       steps:
#         - uses: actions/checkout@v5
#         - uses: OASIS-Docs/publication-assurance@v1
#           with:
#             target: ${{ inputs.target }}
#
# The step fails (red CI) when the gate reports one or more blockers; warnings
# do not fail the build (the gate exits 0 on "publishable").
#
# By default the run page is now self-contained: a GitHub Step Summary shows
# the verdict and full findings list (no need to open raw logs), and
# pubcheck-report.txt / pubcheck-report.json are written under report-dir
# (default "pubcheck-report") for the caller to upload as an artifact if it
# wants a downloadable copy. The same directory also receives the full
# Validation Report, pubcheck-validation.md, pubcheck-validation.html and
# (where headless Chrome is available, as on GitHub's Ubuntu runners)
# pubcheck-validation.pdf:
# every check class and every individual condition with its result, the value
# observed and what it was compared against, which is the report OASIS staff
# produce at intake. The Step Summary carries its tables too. All of this is
# purely additive -- set report-dir: "" and/or write-summary: "false" to opt
# back out; target/args/python-version/
# install-poppler and the exit-code gate contract are unchanged from earlier
# releases.

name: "OASIS pub-check"
description: "Run the OASIS publication acceptance gate (oasis-pub-check) against a TC package or stage directory."
author: "OASIS Open"

branding:
  icon: "check-circle"
  color: "blue"

inputs:
  target:
    description: "Stage directory or package .zip to check, relative to the calling repo's checkout (e.g. work/v1.0/csd01 or dist/mytc-v1.0-csd01.zip)."
    required: true
  args:
    description: "Extra flags passed through to oasis_pub_check.py (e.g. '--json' for machine-readable output, '--emit-manifest')."
    required: false
    default: ""
  python-version:
    description: "Python version to run the gate on."
    required: false
    default: "3.x"
  install-poppler:
    description: "Install poppler-utils (pdftotext/pdffonts) for the optional PDF cross-checks. Ignored on non-Linux runners; the gate runs without it either way."
    required: false
    default: "true"
  report-dir:
    description: "Directory (relative to the caller's working directory) to write pubcheck-report.txt, pubcheck-report.json and the full Validation Report (pubcheck-validation.md, .html and, where headless Chrome is available, .pdf). Set to '' to skip writing report files."
    required: false
    default: "pubcheck-report"
  write-summary:
    description: "Append a GitHub Step Summary section (verdict + full ordered findings list) for this target. Set to 'false' to skip."
    required: false
    default: "true"
  summary-title:
    description: "Label for the Step Summary heading. Defaults to the target path -- set this when calling the action more than once (e.g. in a matrix) so each section is distinguishable."
    required: false
    default: ""

outputs:
  exit-code:
    description: "Exit code from the primary oasis_pub_check.py invocation (with the caller's own `args`). 0 = publishable, 1 = blockers present, 2 = the target could not be read (usually a wrong `target:` path). This is what fails the step."
    value: ${{ steps.pubcheck.outputs.exit_code }}
  blockers:
    description: "Number of BLOCKER-severity findings."
    value: ${{ steps.pubcheck.outputs.blockers }}
  warnings:
    description: "Number of WARN-severity findings."
    value: ${{ steps.pubcheck.outputs.warnings }}
  report-txt:
    description: "Path to the human-readable findings report. Empty if report-dir was set to ''."
    value: ${{ steps.pubcheck.outputs.report_txt }}
  report-json:
    description: "Path to the --json findings report. Empty if report-dir was set to ''."
    value: ${{ steps.pubcheck.outputs.report_json }}
  report-validation-md:
    description: "Path to the full Validation Report in Markdown: every check class and every individual condition with its result (PASS/WARN/BLOCKER/NA), the value observed and what it was compared against. Empty if report-dir was set to '' or the report could not be rendered."
    value: ${{ steps.pubcheck.outputs.report_validation_md }}
  report-validation-html:
    description: "Path to the same Validation Report as one self-contained HTML page. Empty if report-dir was set to '' or the report could not be rendered."
    value: ${{ steps.pubcheck.outputs.report_validation_html }}
  report-validation-pdf:
    description: "Path to the same Validation Report as an A4 landscape PDF, printed with headless Chrome (light theme, header rows repeated on every page, title and Page X of Y in the footer). Empty if report-dir was set to '', the report could not be rendered, or no Chrome/Chromium was available; a missing PDF is a warning and never changes the gate's result."
    value: ${{ steps.pubcheck.outputs.report_validation_pdf }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pdftotext (optional PDF cross-check)
      if: inputs.install-poppler == 'true' && runner.os == 'Linux'
      shell: bash
      # Non-fatal: the gate soft-degrades when pdftotext/pdffonts are absent, so
      # a package-manager hiccup must never fail the build.
      run: sudo apt-get update && sudo apt-get install -y poppler-utils || echo "poppler-utils unavailable; PDF cross-checks will be skipped"

    - name: Run the OASIS publication gate
      id: pubcheck
      shell: bash
      # continue-on-error lets the remaining internal steps (summary, report
      # files) run even when the gate finds blockers; the final "Enforce gate
      # result" step below re-raises the SAME exit code captured here, so the
      # step the caller sees is unaffected -- it still fails on a blocker,
      # exactly as every release before this one.
      continue-on-error: true
      # target and args come in as env vars, not interpolated into the command
      # line, so a value cannot inject shell. $EXTRA_ARGS stays unquoted so
      # multiple flags word-split into argv; variable expansion does not re-run
      # command substitution, so a hostile value is passed as a literal argument.
      env:
        ACTION_PATH: ${{ github.action_path }}
        TARGET: ${{ inputs.target }}
        EXTRA_ARGS: ${{ inputs.args }}
        REPORT_DIR: ${{ inputs.report-dir }}
        SUMMARY_TITLE: ${{ inputs.summary-title }}
      run: |
        set +o errexit

        # Primary invocation: exactly the command every prior release ran,
        # with the caller's own args, teed to a temp file so its exit code
        # (the authoritative one) and its exact stdout are both preserved.
        python3 "$ACTION_PATH/pub-check/oasis_pub_check.py" "$TARGET" $EXTRA_ARGS \
          | tee "$RUNNER_TEMP/oasis-pub-check.txt"
        exit_code="${PIPESTATUS[0]}"

        # Second invocation, --json appended, purely to compute blockers/
        # warnings and to emit report.json. Idempotent if the caller's own
        # args already included --json. Its own exit code is not used --
        # exit_code above (the primary run) remains the sole source of truth
        # for the gate contract.
        python3 "$ACTION_PATH/pub-check/oasis_pub_check.py" "$TARGET" $EXTRA_ARGS --json \
          > "$RUNNER_TEMP/oasis-pub-check.json"

        blockers=$(python3 -c "import json; d = json.load(open('$RUNNER_TEMP/oasis-pub-check.json')); print(sum(1 for x in d['findings'] if x['severity'] == 'BLOCKER'))")
        warnings=$(python3 -c "import json; d = json.load(open('$RUNNER_TEMP/oasis-pub-check.json')); print(sum(1 for x in d['findings'] if x['severity'] == 'WARN'))")

        echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
        echo "blockers=${blockers}" >> "$GITHUB_OUTPUT"
        echo "warnings=${warnings}" >> "$GITHUB_OUTPUT"

        # The full Validation Report (every check class and condition, not
        # only the findings), rendered from the --json run above. A rendering
        # failure is a warning, never a change to the gate's exit code.
        # A matrix of calls shares RUNNER_TEMP: clear the previous call's copy.
        rm -f "$RUNNER_TEMP/pubcheck-validation.md" "$RUNNER_TEMP/pubcheck-validation.html" \
          "$RUNNER_TEMP/pubcheck-validation.pdf"
        validation_ok=0
        if python3 "$ACTION_PATH/pub-check/validation_report.py" \
            "$RUNNER_TEMP/oasis-pub-check.json" \
            --md "$RUNNER_TEMP/pubcheck-validation.md" \
            --html "$RUNNER_TEMP/pubcheck-validation.html" \
            --pdf "$RUNNER_TEMP/pubcheck-validation.pdf" \
            --title="$SUMMARY_TITLE" --exit-code "$exit_code"; then
          validation_ok=1
          # The PDF needs headless Chrome (google-chrome on GitHub's Ubuntu
          # runners). Without one the renderer skips it and says why above.
          if [ ! -s "$RUNNER_TEMP/pubcheck-validation.pdf" ]; then
            echo "::warning::pub-check validation report PDF not written (no headless Chrome or Chromium); the Markdown and HTML reports are unaffected"
          fi
        else
          echo "::warning::pub-check validation report could not be rendered; the findings reports are unaffected"
        fi

        if [ -n "$REPORT_DIR" ]; then
          mkdir -p "$REPORT_DIR"
          cp "$RUNNER_TEMP/oasis-pub-check.txt" "$REPORT_DIR/pubcheck-report.txt"
          cp "$RUNNER_TEMP/oasis-pub-check.json" "$REPORT_DIR/pubcheck-report.json"
          echo "report_txt=${REPORT_DIR}/pubcheck-report.txt" >> "$GITHUB_OUTPUT"
          echo "report_json=${REPORT_DIR}/pubcheck-report.json" >> "$GITHUB_OUTPUT"
          if [ "$validation_ok" = 1 ]; then
            cp "$RUNNER_TEMP/pubcheck-validation.md" "$REPORT_DIR/pubcheck-validation.md"
            cp "$RUNNER_TEMP/pubcheck-validation.html" "$REPORT_DIR/pubcheck-validation.html"
            echo "report_validation_md=${REPORT_DIR}/pubcheck-validation.md" >> "$GITHUB_OUTPUT"
            echo "report_validation_html=${REPORT_DIR}/pubcheck-validation.html" >> "$GITHUB_OUTPUT"
            if [ -s "$RUNNER_TEMP/pubcheck-validation.pdf" ]; then
              cp "$RUNNER_TEMP/pubcheck-validation.pdf" "$REPORT_DIR/pubcheck-validation.pdf"
              echo "report_validation_pdf=${REPORT_DIR}/pubcheck-validation.pdf" >> "$GITHUB_OUTPUT"
            else
              rm -f "$REPORT_DIR/pubcheck-validation.pdf"
              echo "report_validation_pdf=" >> "$GITHUB_OUTPUT"
            fi
          else
            # Never leave an earlier call's report beside this call's findings.
            rm -f "$REPORT_DIR/pubcheck-validation.md" "$REPORT_DIR/pubcheck-validation.html" \
              "$REPORT_DIR/pubcheck-validation.pdf"
            echo "report_validation_md=" >> "$GITHUB_OUTPUT"
            echo "report_validation_html=" >> "$GITHUB_OUTPUT"
            echo "report_validation_pdf=" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "report_txt=" >> "$GITHUB_OUTPUT"
          echo "report_json=" >> "$GITHUB_OUTPUT"
          echo "report_validation_md=" >> "$GITHUB_OUTPUT"
          echo "report_validation_html=" >> "$GITHUB_OUTPUT"
          echo "report_validation_pdf=" >> "$GITHUB_OUTPUT"
        fi

        echo "oasis-pub-check exit code: ${exit_code}"

    - name: Write step summary
      if: always() && inputs.write-summary == 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SUMMARY_TITLE: ${{ inputs.summary-title }}
        REPORT_DIR: ${{ inputs.report-dir }}
        EXIT_CODE: ${{ steps.pubcheck.outputs.exit_code }}
      run: |
        REPORT_DIR_ARGS=()
        if [ -n "$REPORT_DIR" ]; then
          REPORT_DIR_ARGS=(--report-dir "$REPORT_DIR")
        fi
        python3 "$ACTION_PATH/pub-check/render_summary.py" \
          "$RUNNER_TEMP/oasis-pub-check.json" \
          --txt "$RUNNER_TEMP/oasis-pub-check.txt" \
          --title="$SUMMARY_TITLE" \
          "${REPORT_DIR_ARGS[@]}"
        # The readable per-check tables, when the report rendered.
        if [ -f "$RUNNER_TEMP/pubcheck-validation.md" ]; then
          FILES_ARGS=()
          if [ -n "$REPORT_DIR" ]; then
            FILES="$REPORT_DIR/pubcheck-validation.md and $REPORT_DIR/pubcheck-validation.html"
            if [ -s "$REPORT_DIR/pubcheck-validation.pdf" ]; then
              FILES="$REPORT_DIR/pubcheck-validation.md, $REPORT_DIR/pubcheck-validation.html and $REPORT_DIR/pubcheck-validation.pdf"
            fi
            FILES_ARGS=(--report-files "$FILES")
          fi
          python3 "$ACTION_PATH/pub-check/validation_report.py" \
            "$RUNNER_TEMP/oasis-pub-check.json" \
            --md "$RUNNER_TEMP/pubcheck-validation.md" \
            --title="$SUMMARY_TITLE" --exit-code "$EXIT_CODE" --step-summary \
            "${FILES_ARGS[@]}" \
            || echo "::warning::validation tables could not be added to the step summary"
        fi

    - name: Enforce gate result
      if: always()
      shell: bash
      env:
        EXIT_CODE: ${{ steps.pubcheck.outputs.exit_code }}
      run: exit "${EXIT_CODE}"
