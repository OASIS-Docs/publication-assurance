criteria:
- id: AC-CONTENT-01
  statement: A Standards Track work product package MUST contain a separate, top-level, numbered Conformance
    section, populated with substantive clauses (not the unpopulated template placeholder), once it is
    submitted for public review (Committee Specification Draft on the public-review track), approved as
    a Committee Specification, or approved as an OASIS Standard.
  severity: BLOCKER
  applies: both
  machine_testable: true
  authorities:
  - doc: tc-process.txt
    url: https://www.oasis-open.org/policies-guidelines/tc-process-2017-05-26/
    section: 2.2.6 Conformance Clauses
    quote: A Standards Track Work Product that is approved by the TC at the Committee Specification Public
      Review Draft, Committee Specification or OASIS Standard level must include a separate section, listing
      a set of numbered conformance clauses , to which any implementation of the specification must adhere
      in order to claim conformance to the specification (or any optional portion thereof).
  - doc: handbook-Conformance.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/Conformance.html
    section: When conformance clauses are required (Policy requirement)
    quote: A Standards Track work product must include a conformance clause section before it can be submitted
      for public review (the Committee Specification Public Review Draft stage), approved as a Committee
      Specification (CS) , or approved as an OASIS Standard (OS) .
  - doc: handbook-WorkProductLifecycle.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/WorkProductLifecycle.html
    section: Standards Track (Public Review)
    quote: A Standards Track work product approved at the Committee Specification Public Review Draft
      , Committee Specification, or OASIS Standard level must include a separate, numbered conformance
      clause section
  - doc: handbook-CommitteeSpecDrafts.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/CommitteeSpecDrafts.html
    section: Quality requirements at the csd stage
    quote: The trigger is therefore the public-review stage (the Committee Specification Public Review
      Draft level), not the initial §2.5 CSD-approval ballot . A CSD approved only for internal development
      need not yet carry the conformance section; the obligation attaches when that CSD is submitted for
      public review.
  - doc: handbook-Conformance.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/Conformance.html
    section: Required structure of the conformance section
    quote: Work product templates provided by OASIS TC Administration include a placeholder conformance
      section; editors must populate it with substantive clauses before the work product is submitted
      for public review.
  coverage:
    status: partial
    checks:
    - check: template
      sig: No Conformance section found
    note: Check 61 tests only that a Conformance section exists (md track); populated-vs-placeholder content
      and the track/stage gating (Standards Track at public-review/CS/OS) are not tested.
- id: AC-CONTENT-02
  statement: A Non-Standards Track work product package (Committee Note, Technical Report) MUST NOT contain
    normative content that defines mandatory conformance requirements, except where explicitly quoted
    as an excerpt from a Standards Track work product; it is not required to carry a conformance section.
  severity: BLOCKER
  applies: both
  machine_testable: false
  authorities:
  - doc: tc-process.txt
    url: https://www.oasis-open.org/policies-guidelines/tc-process-2017-05-26/
    section: 2.1 Introduction
    quote: Non-Standards Track Work Products may not contain Normative content except as excerpts from
      a Standards Track Work Product.
  - doc: naming-directives.txt
    url: https://docs.oasis-open.org/specGuidelines/ndr/namingDirectives.html
    section: 9 Notes - Track
    quote: 'A Non-Standards Track Work Product does

      not contain normative statements that define mandatory conformance

      requirements.'
  - doc: handbook-Conformance.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/Conformance.html
    section: When conformance clauses are required
    quote: Non-Standards Track work products (Committee Notes, Technical Reports) are not required to
      include conformance clauses, though TCs may choose to include them.
  coverage:
    status: missing
    note: No condition scans Non-Standards Track packages for mandatory normative language outside quoted
      excerpts.
- id: AC-CONTENT-03
  statement: Where a Conformance section is present, it MUST be a top-level numbered section (not a subsection
    buried elsewhere) populated with individually and uniquely numbered conformance clauses, and clause
    numbering MUST remain stable across document revisions.
  severity: BLOCKER
  applies: both
  machine_testable: true
  authorities:
  - doc: handbook-Conformance.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/Conformance.html
    section: Required structure of the conformance section (Policy requirement)
    quote: A separate, top-level numbered section of the work product (not a subsection buried elsewhere).
  - doc: handbook-Conformance.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/Conformance.html
    section: Required structure of the conformance section (Policy requirement)
    quote: Populated with individually numbered conformance clauses (e.g., Clause 1, Clause 2, …) so that
      implementers and Statements of Use can cite specific clauses by number.
  - doc: handbook-WPQualityRequirements.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/WPQualityRequirements.html
    section: Writing conformance clauses
    quote: Clause numbering must be unique and stable across revisions.
  coverage:
    status: missing
    note: Existence of a Conformance section is tested (check 61, attached to AC-CONTENT-01) but top-level
      placement, numbered clauses, and cross-revision numbering stability are not.
- id: AC-CONTENT-04
  statement: Each conformance clause MUST clearly identify the conformance target(s) it applies to, MUST
    refer precisely to normative statements in the specification's main body, and MUST NOT introduce new
    normative statements or refer to content that was qualified as non-normative.
  severity: BLOCKER
  applies: both
  machine_testable: false
  authorities:
  - doc: handbook-Conformance.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/Conformance.html
    section: The 10 core rules (Rule 1)
    quote: Identify conformance targets in each clause. Each conformance clause must clearly identify
      its conformance target, i.e., the type of implementations it applies to.
  - doc: handbook-Conformance.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/Conformance.html
    section: The 10 core rules (Rule 2)
    quote: Define conformance targets before using them. The different conformance targets must be clearly
      defined prior to their association with conformance clauses.
  - doc: handbook-Conformance.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/Conformance.html
    section: The 10 core rules (Rule 5)
    quote: Refer precisely to normative body content. A conformance clause must refer precisely and unambiguously
      to normative statements and content in the specification's main body.
  - doc: handbook-Conformance.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/Conformance.html
    section: The 10 core rules (Rule 6)
    quote: Do not introduce new normative statements. A conformance clause must not introduce new normative
      statements that could instead have been part of the specification's main body.
  - doc: handbook-Conformance.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/Conformance.html
    section: The 10 core rules (Rule 7)
    quote: Do not refer to non-normative content. A conformance clause must not refer to content in the
      specification's main body that was qualified as non-normative.
  coverage:
    status: missing
    note: Clause-level target identification and normative-reference precision are semantic; no condition
      attempts them.
- id: AC-CONTENT-05
  statement: A Standards Track work product package SHOULD include a References section that lists Normative
    References separately from Informative References, with normative and informative content marked consistently
    throughout the document.
  severity: WARN
  applies: both
  machine_testable: true
  authorities:
  - doc: handbook-WPQualityChecklist.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/WPQualityChecklist.html
    section: Editorial quality verification checklist, key areas
    quote: 'Normative vs. informative content: sections marked consistently; normative references listed
      separately from informative references.'
  - doc: naming-directives.txt
    url: https://docs.oasis-open.org/specGuidelines/ndr/namingDirectives.html
    section: 9 Notes - Track
    quote: 'A Standards Track Work Product, intended as an implementation

      specification, contains a required set of numbered conformance clauses

      and has Normative References.'
  coverage:
    status: missing
    note: No condition tests for a References section or normative/informative separation.
- id: AC-CONTENT-06
  statement: The package's table of contents SHOULD accurately and currently reflect the document's actual
    section numbers and headings.
  severity: WARN
  applies: both
  machine_testable: true
  authorities:
  - doc: handbook-WPQualityChecklist.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/WPQualityChecklist.html
    section: Editorial quality verification checklist, key areas
    quote: 'Document consistency: section numbers, cross-references, defined term capitalization, and
      table of contents are current and internally consistent.'
  coverage:
    status: partial
    checks:
    - check: html-anchors
      sig: has no matching anchor in the HTML
    - check: html-anchors
      sig: no internal (fragment) links at all
    note: Fragment-link resolution and presence of a linked TOC are tested; literal agreement of TOC entries
      with actual heading text/numbers is not.
- id: AC-CONTENT-07
  statement: Wherever RFC 2119 / BCP 14 key words (MUST, SHALL, SHOULD, MAY, etc.) are used as normative
    key words, the document SHOULD declare that usage in a keywords/conventions section and MUST use those
    key words consistently.
  severity: WARN
  applies: both
  machine_testable: true
  authorities:
  - doc: handbook-WPQualityChecklist.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/WPQualityChecklist.html
    section: Editorial quality verification checklist, key areas
    quote: 'Keyword guidelines: RFC 2119 / BCP 14 keywords (MUST, SHALL, SHOULD, MAY, etc.) used consistently
      and declared in a keywords section where employed.'
  - doc: handbook-Conformance.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/Conformance.html
    section: Normative versus non-normative content
    quote: When a specification incorporates RFC 2119 (or its successor BCP 14) for normative keywords,
      the Guidelines recommend stating that in the conformance section or in the introductory section
      on conventions.
  coverage:
    status: partial
    checks:
    - check: rfc-keywords
      sig: does not cite RFC 2119
    - check: rfc-keywords
      sig: RFC 8174
    note: 'md track only: RFC 2119 citation backing and RFC 8174 pairing are tested; docx track and consistency-of-usage
      across the body are not. Codex: authorities support SHOULD, not MUST, for consistency.'
  codex_concern: The quoted authorities support declaring RFC 2119/BCP 14 usage as a recommendation/checklist
    item and using keywords consistently, but they do not clearly support a mandatory 'MUST use those
    key words consistently' requirement. The criterion should likely use SHOULD throughout or cite stronger
    policy text for the MUST.
- id: AC-CONTENT-08
  statement: Appendices, examples, and other non-normative content SHOULD be explicitly labelled 'Non-normative'
    so they are not mistaken for conformance requirements.
  severity: WARN
  applies: both
  machine_testable: true
  authorities:
  - doc: handbook-Conformance.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/Conformance.html
    section: Normative versus non-normative content
    quote: Appendices and examples that are not part of the conformance requirements should be marked
      "Non-normative".
  - doc: handbook-Conformance.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/Conformance.html
    section: Normative versus non-normative content
    quote: Provides explanatory, illustrative, or informative content; does not create binding obligations
      for conformance. Should be clearly labelled.
  coverage:
    status: missing
    note: No condition tests for 'Non-normative' labels on appendices/examples.
- id: AC-CONTENT-09
  statement: An OASIS Standard's conformance clauses MUST be preserved unchanged from the approved Committee
    Specification they were promoted from; substantive changes follow the Approved Errata process, not
    republication.
  severity: BLOCKER
  applies: both
  machine_testable: true
  authorities:
  - doc: handbook-Conformance.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/Conformance.html
    section: OASIS Standard os
    quote: Conformance clauses are preserved unchanged from the approved Committee Specification. Amendments
      to a published OASIS Standard follow the Approved Errata process.
- id: AC-CONTENT-10
  statement: Conformance clause numbering SHOULD be unique within the work product and stable across revisions,
    so that a clause number continues to identify the same requirement.
  severity: WARN
  applies: both
  machine_testable: true
  authorities:
  - doc: handbook-WPQualityRequirements.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/WPQualityRequirements.html
    section: Key principles
    quote: Clause numbering must be unique and stable across revisions.
- id: AC-CONTENT-11
  statement: After a public review concludes, the TC MUST prepare a comment resolution log, approve it
    by Full Majority Vote, and submit it to the OASIS TC Administrator.
  severity: BLOCKER
  applies: both
  machine_testable: true
  authorities:
  - doc: tc-process.txt
    url: https://www.oasis-open.org/policies-guidelines/tc-process-2017-05-26/
    section: 2.6 Public Review
    quote: the TC shall prepare a comment resolution log, approve it by Full Majority Vote and submit
      it to the OASIS TC Administrator.
- id: AC-FORMATS-01
  statement: 'The package MUST include the approved deliverable in three formats: an editable source format,
    HTML or XHTML, and PDF.'
  severity: BLOCKER
  applies: both
  machine_testable: true
  authorities:
  - doc: tc-process.txt
    url: https://www.oasis-open.org/policies-guidelines/tc-process-2017-05-26/
    section: 2.2.2 File Formats
    quote: All approved versions of OASIS Deliverables must be published in (1) editable source, (2) HTML
      or XHTML, and (3) PDF formats.
  - doc: handbook-WPQualityRequirements.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/WPQualityRequirements.html
    section: File formats and document repository
    quote: 'Approved OASIS deliverables must be published in three formats: an editable source format,
      HTML or XHTML, and PDF, with one designated as the authoritative version.'
  coverage:
    status: implemented
    checks:
    - check: filenames
      sig: No delivery items found
    - check: filenames
      sig: Missing delivery format(s)
    - check: front-matter
      sig: This-stage block does not list
    note: Delivery-format completeness is mechanically enforced (items exist, required formats present,
      This-stage block lists md/html/pdf).
- id: AC-FORMATS-02
  statement: The package MUST explicitly designate exactly one of the three published formats (editable
    source, HTML/XHTML, or PDF) as the authoritative document.
  severity: BLOCKER
  applies: both
  machine_testable: false
  authorities:
  - doc: tc-process.txt
    url: https://www.oasis-open.org/policies-guidelines/tc-process-2017-05-26/
    section: 2.2.2 File Formats
    quote: The TC must explicitly designate one of those formats as the authoritative document.
  - doc: handbook-WPQualityRequirements.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/WPQualityRequirements.html
    section: File formats and document repository
    quote: 'Approved OASIS deliverables must be published in three formats: an editable source format,
      HTML or XHTML, and PDF, with one designated as the authoritative version.'
  coverage:
    status: partial
    checks:
    - check: filenames
      sig: No authoritative source artifact
    note: Presence of an authoritative source artifact is enforced, but the explicit cover-page designation
      of exactly one authoritative format is not verified.
- id: AC-FORMATS-03
  statement: The editable source file for every delivered version of a TC document MUST be present in
    the TC's document repository, alongside the published HTML/PDF renders.
  severity: BLOCKER
  applies: both
  machine_testable: true
  authorities:
  - doc: tc-process.txt
    url: https://www.oasis-open.org/policies-guidelines/tc-process-2017-05-26/
    section: 2.2.2 File Formats
    quote: Editable formats of all versions of TC documents must be delivered to the TC’s document repository.
  - doc: handbook-WPQualityRequirements.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/WPQualityRequirements.html
    section: File formats and document repository
    quote: Editable formats of all versions of TC documents must be delivered to the TC's document repository.
  - doc: naming-directives.txt
    url: https://docs.oasis-open.org/specGuidelines/ndr/namingDirectives.html
    section: 9 Notes - TC document repository
    quote: 'This fulfills the TC Process requirement "Editable formats of

      all versions of TC documents must be delivered to the

      TC''s document repository"'
  coverage:
    status: implemented
    checks:
    - check: filenames
      sig: No authoritative source artifact
    note: 'Editable/authoritative source must travel with the renderings in the package that goes to the
      repository. Codex: ''alongside the renders'' framing is our packaging convention, delivery-to-repository
      is the policy core.'
  codex_concern: The quoted text supports requiring editable formats of all versions to be delivered to
    the TC document repository, but it does not clearly require them to be present 'alongside the published
    HTML/PDF renders.'
- id: AC-FORMATS-04
  statement: For Standards Track work products, every normative computer-language definition (e.g. XML
    instance, schema, code fragment) that carries normative weight MUST be delivered as a standalone plain-text
    file, not only embedded inline in the document body.
  severity: BLOCKER
  applies: both
  machine_testable: true
  authorities:
  - doc: tc-process.txt
    url: https://www.oasis-open.org/policies-guidelines/tc-process-2017-05-26/
    section: 2.2.5 Computer Language Definitions
    quote: All normative computer language definitions must also be provided in separate plain text files;
  - doc: handbook-WPQualityRequirements.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/WPQualityRequirements.html
    section: Machine-readable definitions (Standards Track, mandatory)
    quote: 'This requirement applies to any machine-readable artifact that carries normative weight: embedding
      schema content only within a document body, without a standalone plain-text file, does not satisfy
      §2.2.5. Non-Standards Track Work Products are not subject to this requirement.'
  - doc: handbook-WPQualityRequirements.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/WPQualityRequirements.html
    section: Machine-readable definitions (Standards Track, mandatory) (Policy requirement)
    quote: All normative computer language definitions in a Standards Track Work Product must be well-formed
      and valid, and must also be provided in separate plain-text files . The specification must clearly
      reference those separate files.
  - doc: handbook-WPQualityChecklist.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/WPQualityChecklist.html
    section: Editorial quality verification checklist, key areas
    quote: 'Machine-readable definitions (Standards Track): any machine-readable content (schemas, grammars,
      code) must be provided as separate plain-text files alongside the specification document.'
  - doc: tc-process.txt
    url: https://www.oasis-open.org/policies-guidelines/tc-process-2017-05-26/
    section: 2.2.5 Computer Language Definitions
    quote: All normative computer language definitions that are part of the Work Product, such as XML
      instances, schemas or Java(TM) code, including fragments of such, must be well formed and valid.
  coverage:
    status: partial
    checks:
    - check: schema-id
      sig: not valid JSON (
    note: JSON validity (well-formed-and-valid arm, TCP-012) is tested; standalone-plain-text-file presence
      for inline normative definitions, and non-JSON languages, are not.
- id: AC-FRONTMATTER-01
  statement: 'The package MUST display exactly three persistent URI fields on the cover page / front matter:
    This stage, Previous stage, and Latest stage.'
  severity: BLOCKER
  applies: both
  machine_testable: true
  authorities:
  - doc: handbook-WPQualityRequirements.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/WPQualityRequirements.html
    section: Cover-page metadata and the three required URIs
    quote: Every Work Product must display its persistent URIs on the cover page. OASIS Naming Directives
      v1.7 requires exactly three URI fields, each serving a distinct and permanent role.
  - doc: handbook-WPQualityRequirements.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/WPQualityRequirements.html
    section: Cover-page metadata and the three required URIs (Policy requirement)
    quote: All three URI fields must appear on the cover page. Published resources in the OASIS Library
      must not be deleted or altered; only the "latest stage" alias may be overwritten.
  - doc: handbook-Naming.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/Naming.html
    section: Three required cover-page URIs (Policy requirement)
    quote: Every published work product must carry exactly three version URIs on its cover page.
  - doc: handbook-CommitteeNoteDrafts.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/CommitteeNoteDrafts.html
    section: CND filename and URI pattern examples
    quote: 'Every published CND cover page must carry three required URIs: This stage , Previous stage
      , and Latest stage .'
  - doc: naming-directives.txt
    url: https://docs.oasis-open.org/specGuidelines/ndr/namingDirectives.html
    section: 6.2 Required Document URIs
    quote: 'OASIS requires that Work Products

      present three general kinds of URIs as display metadata, illustrated below: This stage ,

      Previous stage (when applicable), and Latest stage .'
  coverage:
    status: partial
    checks:
    - check: front-matter
      sig: No 'This stage' URL block
    - check: front-matter
      sig: This-stage block does not list
    - check: front-matter
      sig: No 'This version' URL block found on the HTML cover
    - check: pdf-sync
      sig: does not contain the canonical this-stage base URL
    - check: template
      sig: Required front-matter section missing
    note: 'This-stage presence is enforced on md, HTML cover, and PDF, and the template-section gate covers
      front matter generally; independent presence checks for the Previous-stage and Latest-stage fields
      exist only conditionally (89/90 past stage 01) or as URL-format checks. Codex: ''exactly three persistent
      URIs'' overstated given N/A Previous-stage on first publication.'
  codex_concern: The criterion states that exactly three persistent URI fields must appear, but the cited
    Naming Directives text says 'Previous stage' applies 'when applicable,' and first publications may
    use 'N/A' rather than a persistent URI. The 'exactly three persistent URI fields' formulation is therefore
    not clearly supported.
- id: AC-FRONTMATTER-02
  statement: The 'This stage' cover-page URI MUST be unique to the exact published artifact and MUST NOT
    be reused for a different document, version, or stage.
  severity: BLOCKER
  applies: both
  machine_testable: true
  authorities:
  - doc: handbook-WPQualityRequirements.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/WPQualityRequirements.html
    section: Cover-page metadata and the three required URIs (This stage)
    quote: The exact published artifact at this version and stage (e.g., …/csd01/… ). Unique; never reused
      for a different document.
  - doc: naming-directives.txt
    url: https://docs.oasis-open.org/specGuidelines/ndr/namingDirectives.html
    section: 6.2 Required Document URIs
    quote: 'A URI

      specific to the Work Product current at the time of publication; it is

      persistent, permanently assigned to one particular specification

      instance, and is never re-used.'
  - doc: naming-directives.txt
    url: https://docs.oasis-open.org/specGuidelines/ndr/namingDirectives.html
    section: 6.4 URI Persistence
    quote: URIs for published OASIS resources must be persistent.
  coverage:
    status: implemented
    checks:
    - check: revision-collision
      sig: is already published at
    - check: front-matter
      sig: which is not a file in the package
    note: Live-site revision collision plus This-stage-URL-points-at-shipped-file make non-reuse operationally
      tested (requires network).
- id: AC-FRONTMATTER-03
  statement: The 'Previous stage' cover-page URI MUST point to the immediately preceding published instance
    of the work product, or MUST read 'N/A' when the current publication is the first instance.
  severity: BLOCKER
  applies: both
  machine_testable: true
  authorities:
  - doc: handbook-WPQualityRequirements.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/WPQualityRequirements.html
    section: Cover-page metadata and the three required URIs (Previous stage)
    quote: The immediately preceding published instance of this Work Product (e.g., prior CSD revision
      or CS). Write "N/A" if this is the first published version.
  - doc: naming-directives.txt
    url: https://docs.oasis-open.org/specGuidelines/ndr/namingDirectives.html
    section: 6.2 Required Document URIs
    quote: 'If the current publication is the

      very first instance, the text "N/A" is used.'
  coverage:
    status: partial
    checks:
    - check: previous-stage
      sig: the Previous-Stage block is empty or N/A
    - check: previous-stage
      sig: no Previous-version block with docs.oasis-open.org URLs found on the HTML cover
    note: Presence of a Previous-stage citation past stage 01 is tested on both tracks; that it points
      at the immediately preceding published instance (or reads N/A on a first publication) is not verified
      against publication history.
- id: AC-FRONTMATTER-04
  statement: The 'Latest stage' cover-page URI MUST resolve to the persistent version-root location, MUST
    NOT contain the stage-abbreviation/revision-number path component, and is the only one of the three
    required URIs that may be overwritten by a later publication.
  severity: BLOCKER
  applies: both
  machine_testable: true
  authorities:
  - doc: handbook-WPQualityRequirements.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/WPQualityRequirements.html
    section: Cover-page metadata and the three required URIs (Latest stage)
    quote: This is the only URI that may be updated (overwritten) when a newer version is published.
  - doc: handbook-Naming.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/Naming.html
    section: Three required cover-page URIs (Policy requirement)
    quote: 'Latest stage : an alias URI that always points to the most current publication of this work
      product, regardless of stage or revision. Unlike the "This stage" URI, the latest-stage alias is
      overwritten with each new publication (it is the only URI that may be updated after a document is
      published).'
  - doc: naming-directives.txt
    url: https://docs.oasis-open.org/specGuidelines/ndr/namingDirectives.html
    section: 6.2 Required Document URIs
    quote: 'This locator URI does not contain the path component [stage-abbrev][revisionNumber] or stage

      identifier in the filename.'
  coverage:
    status: implemented
    checks:
    - check: front-matter
      sig: Latest-stage URL must point at the version root
