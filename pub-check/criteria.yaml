    url: https://docs.oasis-open.org/specGuidelines/ndr/namingDirectives.html
    section: 8 XML Namespace Identifiers and Namespace Documents
    quote: 'While either "http" or "https" may be

      used in defining a namespace name, they are not interchangeable. One or

      the other must be used consistently.'
  - doc: naming-directives.txt
    url: https://docs.oasis-open.org/specGuidelines/ndr/namingDirectives.html
    section: 8 XML Namespace Identifiers and Namespace Documents
    quote: 'URN-based XML namespaces may

      be declared by existing TCs that have already used this feature, or by

      associated Maintenance Activity TCs, where architectural considerations

      require continued use of URNs. URN-based XML namespaces must not be

      declared otherwise, since they lack a standard, ubiquitous resolution

      method using DNS[+HTTP].'
  coverage:
    status: missing
    note: schema-id checks cover JSON $id, not XML namespace name patterns or http/https consistency.
- id: AC-PACKAGING-21
  statement: The /ns/ URI path segment MUST be used only for XML namespace identifiers, never as the location
    of a retrievable published document; no regular file, directory, or symlink in the package may reuse
    an /ns/ namespace-name string for information-resource identification.
  severity: BLOCKER
  applies: both
  machine_testable: true
  authorities:
  - doc: naming-directives.txt
    url: https://docs.oasis-open.org/specGuidelines/ndr/namingDirectives.html
    section: 8 XML Namespace Identifiers and Namespace Documents
    quote: 'no (file-system) regular files,

      directories/folders, or symbolic links matching information resources

      may make use of these URI strings for resource identification.'
  - doc: handbook-Naming.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/Naming.html
    section: XML namespace rule (/ns/) (Policy requirement)
    quote: 'The /ns/ path element is reserved for non-information resources only : it is for namespace
      identifiers, not for retrievable documents. Do not use /ns/ in the URI of a document you intend
      to publish as a retrievable resource.'
  coverage:
    status: missing
    note: No /ns/-path retrievable-document detection.
- id: AC-PACKAGING-22
  statement: An Errata release MUST use sequential /errataNN/ directories (/errata01/, /errata02/, ...)
    and MUST include the required "list-of-corrections" format instance (the optional "complete-incorporating-errata"
    variant may also be included); once approved, the Errata MUST be made available together with the
    OASIS Standard it corrects in every publication of that standard.
  severity: BLOCKER
  applies: both
  machine_testable: true
  authorities:
  - doc: naming-directives.txt
    url: https://docs.oasis-open.org/specGuidelines/ndr/namingDirectives.html
    section: 4 Name Construction Rules for Files and Directories
    quote: 'The Errata

      process, for example, has its own set of revisions and approvals in a

      progression, with required directories /errata01/ (perhaps: /errata02/

      and /errata03/) and instance variants for the required

      "list-of-corrections" format and optional

      "complete-incorporating-errata" format'
  - doc: tc-process.txt
    url: https://www.oasis-open.org/policies-guidelines/tc-process-2017-05-26/
    section: 2.9 Approved Errata
    quote: Once approved, the Approved Errata shall be made available with the OASIS Standard it corrects,
      in any publication of that OASIS Standard.
  - doc: handbook-Maintenance.txt
    url: https://docs.oasis-open.org/TChandbook/Reference/Maintenance.html
    section: Naming and stage abbreviation
    quote: 'Documents published through the Approved Errata process use the errata stage abbreviation
      in their filenames and URIs. This is one of the four current Standards Track stage abbreviations:
      csd , cs , os , errata .'
  coverage:
    status: missing
    note: The errata stage token is recognized, but sequential /errataNN/ directories and the list-of-corrections
      instance are not tested.
- id: AC-PACKAGING-23
  statement: Once a Committee Specification package is submitted to the TC Administrator as a candidate
    for OASIS Standard, no file in that submitted package may be changed or altered in any way, including
    by Errata or corrigenda, except for narrowly-scoped changes addressing a valid call-for-consent objection.
  severity: BLOCKER
  applies: both
  machine_testable: true
  authorities:
  - doc: tc-process.txt
    url: https://www.oasis-open.org/policies-guidelines/tc-process-2017-05-26/
    section: 2.8.1 Submission of a Committee Specification as a candidate for OASIS Standard
    quote: No part of the submission may be changed or altered in any way after being submitted to the
      TC Administrator, including by Errata or corrigenda.
  - doc: tc-process.txt
    url: https://www.oasis-open.org/policies-guidelines/tc-process-2017-05-26/
    section: 2.8.1 Submission of a Committee Specification as a candidate for OASIS Standard
    quote: Errata, corrigenda or other changes to a Committee Specification are not permitted after its
      submission for OASIS Standard approval, except that changes which address comments associated with
      valid objections to a call for consent for OASIS Standard may be allowed as described in section
      2.8.3 below.
  coverage:
    status: missing
    note: Manifest sha256 (check 72) proves internal integrity only; no gate compares a COS-submitted
      package against its submitted state.
- id: AC-PACKAGING-24
  statement: An XML namespace name declared by the Work Product MUST use the http and https schemes consistently;
    the two schemes are not interchangeable and MUST NOT both be declared for the same namespace.
  severity: BLOCKER
  applies: both
  machine_testable: true
  authorities:
  - doc: naming-directives.txt
    url: https://docs.oasis-open.org/specGuidelines/ndr/namingDirectives.html
    section: 8 Namespace Identifiers
    quote: While either "http" or "https" may be used in defining a namespace name, they are not interchangeable.
      One or the other must be used consistently.
- id: AC-PACKAGING-25
  statement: URN-based XML namespaces MUST NOT be declared, except where a TC's earlier practice was grandfathered
    with Project Administration approval.
  severity: BLOCKER
  applies: both
  machine_testable: true
  authorities:
  - doc: naming-directives.txt
    url: https://docs.oasis-open.org/specGuidelines/ndr/namingDirectives.html
    section: 8 Namespace Identifiers
    quote: URN-based XML namespaces must not be declared otherwise, since they lack a standard, ubiquitous
      resolution method using DNS[+HTTP].
