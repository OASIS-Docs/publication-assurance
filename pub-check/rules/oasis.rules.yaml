meta:
  name: oasis-publication-assurance
  description: >-
    OASIS TC Process baseline quality rules for all Standards Track Work Products.
    Maintained in OASIS-Docs/publication-assurance; copy here unchanged when the
    upstream file is published.  Spec-level rule files extend this baseline via
    meta.extends: oasis and add TC- and spec-specific checks on top.
    Source-text rules that a nide authoring engine can prove from the document
    prose live here; requirements that can only be checked on the delivered
    package (filenames, published URIs, cross-file agreement, rendered
    artifacts) stay exclusively in pub-check Python. One requirement, one home.

rules:

  # ── OASIS template structure ───────────────────────────────────────────────

  - id: OASIS-SCOPE
    severity: BLOCKER
    description: A Scope section must be present (OASIS TC Process §2.18)
    check:
      type: section-present
      pattern: '^Scope'
      flags: IGNORECASE

  - id: OASIS-CONFORMANCE
    severity: BLOCKER
    description: A Conformance section must be present (OASIS TC Process §2.18)
    check:
      type: section-present
      pattern: '^Conformance'
      flags: IGNORECASE

  # An OASIS Open Project is governed by a Project Governing Board, not a TC, and
  # its template says "Open Project:" and "Project Chair:". Requiring the TC wording
  # would tell an Open Project work product (NIEMOpen) to invent a Technical
  # Committee section it does not have. Kept in step with ORG_HEADING and
  # TEMPLATE_SECTIONS in pub-check/oasis_pub_check.py: the two homes check the same
  # prose, so they must accept the same prose or a document passes one and fails the
  # other for no reason a reader can see.
  - id: OASIS-TECHNICAL-COMMITTEE
    severity: BLOCKER
    description: >-
      A Technical Committee entry (or, for an Open Project, an Open Project entry)
      must appear in the front matter
    check:
      type: section-present
      pattern: 'Technical Committee|Open Project'
      flags: IGNORECASE

  - id: OASIS-CHAIRS
    severity: WARN
    description: >-
      A Chairs entry must appear in the front matter, with or without a qualifier
      ("Chairs", "Project Chair", "NTAC Technical Steering Committee Chairs")
    check:
      type: section-present
      pattern: '^([\w/&.-]+ ){0,5}Chairs?$'
      flags: IGNORECASE

  - id: OASIS-EDITORS
    severity: WARN
    description: An Editors entry must appear in the front matter
    check:
      type: section-present
      pattern: '^Editors?$'
      flags: IGNORECASE

  - id: OASIS-ABSTRACT
    severity: BLOCKER
    description: An Abstract section must be present (OASIS template)
    check:
      type: section-present
      pattern: '^Abstract'
      flags: IGNORECASE

  - id: OASIS-LOGO
    severity: WARN
    description: The canonical OASIS logo must appear in the document
    check:
      type: any-match
      target: prose
      pattern: 'OASISLogo'

  # ── Cover page ─────────────────────────────────────────────────────────────

  # The three required URI blocks. The expressions are TEMPLATE_SECTIONS in
  # pub-check/oasis_pub_check.py, anchored at the heading start as pub-check
  # anchors them, so the two homes accept the same cover. Both template wordings
  # pass: "This stage" (current) and "This version" (earlier templates, DPS). A
  # first stage keeps its Previous heading and writes "N/A" under it, which a
  # heading-presence rule accepts, so Previous can block like the other two.
  - id: OASIS-COVER-THIS-STAGE
    severity: BLOCKER
    description: >-
      The cover must carry a This stage (or This version) URI block (TC
      Handbook, Editorial quality verification checklist, 'Cover page
      completeness': the three required URIs)
    check:
      type: section-present
      pattern: '^This (Stage|Version)'
      flags: IGNORECASE

  - id: OASIS-COVER-PREVIOUS-STAGE
    severity: BLOCKER
    description: >-
      The cover must carry a Previous stage (or Previous version) URI block,
      reading N/A on a first stage (TC Handbook, Editorial quality verification
      checklist, 'Cover page completeness': the three required URIs)
    check:
      type: section-present
      pattern: '^Previous (Stage|Version)'
      flags: IGNORECASE

  - id: OASIS-COVER-LATEST-STAGE
    severity: BLOCKER
    description: >-
      The cover must carry a Latest stage (or Latest version) URI block (TC
      Handbook, Editorial quality verification checklist, 'Cover page
      completeness': the three required URIs)
    check:
      type: section-present
      pattern: '^Latest (Stage|Version)'
      flags: IGNORECASE

  # nide has no title target, so this asks only that some heading carries a
  # "Version <number>" identifier; on a cover that is the title. Whether the
  # number agrees with the package's own version directory, and how the title
  # is composed around it, stay in pub-check (title-version).
  - id: OASIS-TITLE-VERSION
    severity: WARN
    description: >-
      The title must carry a Version identifier, as in '<name> Version
      <number>' (TC Handbook, Editorial quality verification checklist, 'Cover
      page completeness': version identifier; Naming Directives v1.7 s5.1)
    check:
      type: section-present
      pattern: '\bVersion\s+\d+(\.\d+)*\b'

  # The stage line under the title, in the Technical Committee forms
  # (Committee Specification Draft 02, Committee Note 01, OASIS Standard,
  # Candidate OASIS Standard, OASIS Approved Errata) and the Open Project forms
  # (Project Specification Draft 01, Project Note 01).
  - id: OASIS-COVER-STAGE
    severity: WARN
    description: >-
      The cover must name the stage of the work product, such as 'Committee
      Specification Draft 02' or 'OASIS Standard' (TC Handbook, Editorial
      quality verification checklist, 'Cover page completeness': stage)
    check:
      type: section-present
      pattern: '^(?:(?:Committee|Project) (?:Specification|Note)(?: Draft)? \d{2}|(?:Candidate )?OASIS Standard|(?:OASIS )?Approved Errata)\b'

  # The template titles the section that declares the IPR mode and copyright
  # "Notices"; the current template folds it into "License, Document Status,
  # and Notices". Any heading containing the word passes.
  - id: OASIS-NOTICES
    severity: WARN
    description: >-
      A Notices section must be present (TC Handbook, Editorial quality
      verification checklist, 'IPR notice')
    check:
      type: section-present
      pattern: 'Notices|License, Document Status'
      flags: IGNORECASE

  # ── RFC 2119 / 8174 citation ───────────────────────────────────────────────

  - id: OASIS-RFC-2119-CITED
    severity: BLOCKER
    description: >-
      When RFC 2119 normative keywords are used (MUST, SHALL, SHOULD, MAY, …),
      RFC 2119 must be cited in the normative references.
    check:
      type: conditional
      condition:
        type: any-match
        target: prose
        # All-caps normative keyword; do NOT add IGNORECASE — case matters
        pattern: '\b(MUST NOT|MUST|SHALL NOT|SHALL|SHOULD NOT|SHOULD|NOT RECOMMENDED|RECOMMENDED|OPTIONAL|REQUIRED)\b'
      then:
        type: any-match
        target: links
        pattern: '#RFC2119'

  - id: OASIS-RFC-8174-PAIRED
    severity: WARN
    description: >-
      When RFC 2119 is cited, RFC 8174 (uppercase-only clarification) must
      also be cited alongside it.
    check:
      type: conditional
      condition:
        type: any-match
        target: links
        pattern: '#RFC2119'
      then:
        type: any-match
        target: links
        pattern: '#RFC8174'

  # The template declares the key words in their own section: "Key Words"
  # (DPS, OpenEoX), "Terminology" (CSAF, KMIP, PKCS#11) or "Key words" on an
  # Open Project cover (NIEMOpen). Same condition as OASIS-RFC-2119-CITED.
  - id: OASIS-KEYWORDS-SECTION
    severity: WARN
    description: >-
      When RFC 2119 normative keywords are used, they must be declared in a
      Key Words (or Terminology) section (TC Handbook, Editorial quality
      verification checklist, 'Keyword guidelines': declared in a keywords
      section where employed)
    check:
      type: conditional
      condition:
        type: any-match
        target: prose
        # All-caps normative keyword; case matters, so no IGNORECASE here
        pattern: '\b(MUST NOT|MUST|SHALL NOT|SHALL|SHOULD NOT|SHOULD|NOT RECOMMENDED|RECOMMENDED|OPTIONAL|REQUIRED)\b'
      then:
        type: section-present
        pattern: 'Key ?words|Terminology'
        flags: IGNORECASE

  # ── Editorial residue ──────────────────────────────────────────────────────

  - id: OASIS-RESID-TODO
    severity: BLOCKER
    description: No TODO markers may remain in the prose
    check:
      type: all-match
      target: prose
      pattern: 'TODO[\(:]'
      invert: true

  - id: OASIS-RESID-TBD
    severity: WARN
    description: No bare TBD placeholder lines may remain
    check:
      type: all-match
      target: prose
      pattern: '^\s*tbd\s*$'
      flags: IGNORECASE
      invert: true

  - id: OASIS-RESID-FILL-IN
    severity: WARN
    description: >-
      No 'Will be filled in' placeholders may remain (tolerated early-stage,
      must resolve before Committee Specification)
    # The template's form is "\< Will be filled in at CS01 \>". The phrase
    # inside a sentence is prose ("these dynamic values will be filled in with
    # valid values", KMIP Test Cases v3.0), so it counts only after an opening
    # bracket or opening a line, list item, quote or table cell. Same
    # expression as FILL_IN_PLACEHOLDER_RE in oasis_pub_check.py.
    check:
      type: all-match
      target: prose
      pattern: '(?m)(?:\\?<|&lt;|&#0*60;|&#[xX]0*3[cC];|\[)(?:\s|&nbsp;)*[Ww]ill\s+be\s+filled\s+in\b|(?:^|>|\||\()(?:[ \t\xa0]|&nbsp;)*(?:(?:[-*+]|\d+[.)])[ \t]+)?[*_]{0,2}Will\s+be\s+filled\s+in\b'
      invert: true

  # The OASIS Board-approved work product templates carry editor guidance and
  # say so: "All template instructions are included within angle brackets and
  # need to be deleted prior to publication." When a block survives, it ships as
  # if it were specification text. KMIP Usage Guide v3.0 cnd01 reached public
  # review carrying "NOTE (remove this note and following examples before
  # publication)" and an external reviewer found it on day 5.
  # The character class deliberately admits newlines, because the instruction is
  # routinely wrapped mid-sentence in the source.
  - id: OASIS-RESID-TEMPLATE-INSTRUCTION
    severity: BLOCKER
    description: >-
      No template editor-instruction text may remain (an imperative to remove or
      delete something 'before publication' means an instruction block was not
      deleted)
    check:
      type: all-match
      target: prose
      pattern: '(remove|delete|deleted|removed|strip)[^.;:]{0,80}?(before|prior to)\s+publication'
      flags: IGNORECASE
      invert: true

  # The template's status-section comments paragraph appears exactly once. A
  # second copy rides in on a stale template merge and truncates the sentence
  # it collides with. KMIP Usage Guide v3.0 cnd01 reached public review with
  # the paragraph twice on page 2, the first copy cut off mid-sentence, and a
  # public-review commenter reported it on day 3. [\s\S] spans the whole
  # document because the two copies need not be adjacent.
  - id: OASIS-COMMENTS-PARA-DUP
    severity: WARN
    description: >-
      The template's 'send comments' status paragraph must appear exactly once
      (a duplicated boilerplate block usually truncates the sentence it
      collides with)
    check:
      type: all-match
      target: prose
      pattern: 'should send comments on this[\s\S]{1,6000}?should send comments on this'
      flags: IGNORECASE
      invert: true

  # ── Link hygiene ───────────────────────────────────────────────────────────

  - id: OASIS-LINK-DEAD-LISTS
    severity: WARN
    description: >-
      No links to the retired lists.oasis-open.org mail infrastructure;
      use the Higher Logic comments route instead
    check:
      type: all-match
      target: links
      pattern: 'lists\.oasis-open\.org'
      invert: true

  - id: OASIS-LINK-DOUBLE-SLASH
    severity: WARN
    description: Relative links must not contain double-slash path segments (CDN 404s)
    check:
      type: all-match
      target: relative-links
      pattern: '//'
      invert: true

  # A [shown-url](target-url) link whose visible URL is not its target, the
  # rename artifact of the prov-meta correction round: the cover showed the
  # csd02 address and linked into csd01. The backreference compares the two
  # within one pattern; the shown URL ends on a character other than '/' so a
  # trailing slash on either side is ignored, as pub-check ignores it. Same
  # pairs as the markdown half of link-mismatch in oasis_pub_check.py; the
  # rendered-HTML half of that check stays in pub-check.
  - id: OASIS-LINK-TEXT-MISMATCH
    severity: WARN
    description: >-
      A link that displays a URL must link to that same URL (TC Handbook,
      Editorial quality verification checklist, 'Document consistency':
      cross-references current and internally consistent)
    check:
      type: all-match
      target: prose
      pattern: '\[(https?://[^\]\s]*[^\]\s/])/?\]\((?!\1/?\))https?://[^)\s]+\)'
      invert: true

  # -- Member-only URIs and reference-list hygiene ----------------------------

  - id: OASIS-MEMBER-URI
    severity: BLOCKER
    description: >-
      No OASIS member-only (Kavi) URI may be cited in the document
      (Naming Directives v1.7 s6.6)
    check:
      type: all-match
      target: links
      pattern: '^(?:(?:https?:)?//)?(?:www\.)?oasis-open\.org/(?:apps/org/|committees/download\.php(?:[/?#]|$))'
      flags: IGNORECASE
      invert: true

  - id: OASIS-REFERENCES-SPLIT
    severity: WARN
    description: >-
      Normative references should be listed separately from informative
      references, not under one undifferentiated 'References' heading, for
      Standards Track Work Products (TC Handbook, Editorial quality
      verification checklist, 'Normative vs. informative content')
    check:
      type: conditional
      condition:
        type: section-present
        pattern: '^Conformance'
        flags: IGNORECASE
      then:
        type: conditional
        condition:
          type: section-present
          pattern: '^References\s*$'
          flags: IGNORECASE
        then:
          type: any-match
          target: headings
          pattern: '^(Normative|Informative|Non-Normative)\s+References'
          flags: IGNORECASE
